name: Publish to MCP Registry

# Publishes server.json to the Official MCP Registry
# (registry.modelcontextprotocol.io). The PyPI package itself is published
# separately by publish.yml — this only submits the registry *listing*, so
# it must run AFTER the wheel is on PyPI (the registry verifies ownership by
# reading the `mcp-name:` marker in the published PyPI description).
#
# Auth: github-oidc. Because this repo lives in the `synpareia` GitHub org,
# the workflow's OIDC token proves control of the `io.github.synpareia/*`
# namespace declared in server.json — no interactive login, no PAT, no secret.

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  id-token: write # OIDC token for registry auth
  contents: read

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the registry
        run: ./mcp-publisher publish
